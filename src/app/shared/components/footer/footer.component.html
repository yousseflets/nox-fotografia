<footer class="footer" id="contato">
  <div class="footer__cta section">
    <div class="container footer__cta-inner">
      <h2>Vamos criar algo inesquec&iacute;vel juntos.</h2>
      <a class="btn btn-primary" href="https://wa.me/5511989273898" target="_blank" rel="noopener">
        Solicitar or&ccedil;amento +
      </a>
    </div>
  </div>

  <div class="footer__main container">
    <div class="footer__brand">
      <img src="/nox-logo.png" alt="NOX Fotografia" class="footer__logo" />
    </div>

    <div class="footer__contacts">
      @for (item of contacts; track item.label) {
        <a [href]="item.href" target="_blank" rel="noopener">
          <strong>{{ item.label }}</strong>
          <span>{{ item.value }}</span>
        </a>
      }
    </div>
  </div>

  <div class="footer__bar">
    <div class="container footer__bar-inner">
      <p>&copy; 2026 NOX Fotografia - todos os direitos reservados.</p>
      <p>
        <a routerLink="/fotos">Fotos &agrave; Venda</a>
        &middot; desenvolvido por
        <a
          href="https://www.instagram.com/lycodesolutions?igsh=a3g5c2QzcjFjd214"
          target="_blank"
          rel="noopener"
        >&#64;lycodesolutions</a>
      </p>
    </div>
  </div>
</footer>
