<section class="auth stars">
  <div class="auth__card panel">
    <a class="auth__brand" routerLink="/">
      <img src="/logo-nox.png" alt="NOX Fotografia" />
    </a>
    <h1>Cadastro</h1>
    <p class="auth__sub">Crie sua conta para acessar seus álbuns e baixar as fotos.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="name">Nome</label>
        <input id="name" type="text" formControlName="name" autocomplete="name" />
      </div>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="form-field">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      </div>

      @if (error()) {
        <p class="auth__error">{{ error() }}</p>
      }

      <button class="btn btn-primary auth__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Criando...' : 'Criar conta' }}
      </button>
    </form>

    <p class="auth__footer">
      Já tem conta?
      <a routerLink="/login">Entrar</a>
    </p>
  </div>
</section>
