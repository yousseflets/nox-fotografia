<div class="shell">
  <aside class="sidebar">
    <a class="sidebar__brand" routerLink="/">
      <img src="/nox-logo.png" alt="NOX Fotografia" />
      <span>Admin</span>
    </a>
    <nav>
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a routerLink="/admin/clientes" routerLinkActive="active">Clientes</a>
      <a routerLink="/admin/albuns" routerLinkActive="active">Álbuns</a>

      <div
        class="nav-group"
        [class.nav-group--open]="configOpen()"
        [class.nav-group--active]="isConfigSection()"
      >
        <button
          type="button"
          class="nav-group__toggle"
          (click)="toggleConfig()"
          [attr.aria-expanded]="configOpen()"
        >
          <span>Configuração</span>
          <span class="nav-group__chevron" aria-hidden="true">›</span>
        </button>

        @if (configOpen()) {
          <div class="nav-group__items">
            <a routerLink="/admin/depoimentos" routerLinkActive="active">Depoimentos</a>
            <a routerLink="/admin/galeria" routerLinkActive="active">Galeria</a>
            <a routerLink="/admin/portfolio-categorias" routerLinkActive="active">Portfólio (categorias)</a>
            <a routerLink="/admin/portfolio-fotos" routerLinkActive="active">Portfólio (fotos)</a>
          </div>
        }
      </div>
    </nav>
    <div class="sidebar__footer">
      @if (auth.user$ | async; as user) {
        <p>{{ user.name }}</p>
      }
      <button class="btn btn-outline" type="button" (click)="logout()">Sair</button>
    </div>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
