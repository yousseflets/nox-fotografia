<section class="features section">
  <div class="container">
    <header class="features__head">
      <p class="section-kicker">Por que a NOX</p>
      <h2 class="section-title">Diferenciais</h2>
    </header>

    <div class="features__grid">
      @for (item of items; track item.title) {
        <article class="feature">
          <span class="feature__icon" aria-hidden="true">
            @switch (item.icon) {
              @case ('person') {
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4">
                  <circle cx="24" cy="16" r="7" />
                  <path d="M10 40c2-8 7-12 14-12s12 4 14 12" />
                </svg>
              }
              @case ('moon') {
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M30 10a14 14 0 1 0 8 24 16 16 0 0 1-8-24z" />
                  <path d="M34 14l1.2 2.4L38 18l-2.4 1.2L34 22l-1.2-2.8L30 18l2.8-1.6L34 14z" />
                </svg>
              }
              @case ('diamond') {
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M14 16h20l6 8-16 16L8 24l6-8z" />
                  <path d="M14 16l10 8 10-8M8 24h32M24 24v16" />
                </svg>
              }
              @default {
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path
                    d="M24 40s-14-8.5-14-18a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 9.5-14 18-14 18z"
                  />
                </svg>
              }
            }
          </span>
          <h3>{{ item.title }}</h3>
          <p>{{ item.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
