<section class="page">
  <header>
    <p class="page-kicker">Galeria</p>
    <h1>Meus &aacute;lbuns</h1>
    <p>Voc&ecirc; v&ecirc; apenas os ensaios associados &agrave; sua conta.</p>
  </header>

  <div class="grid">
    @for (album of albums$ | async; track album.id) {
      <a class="album" [routerLink]="['/cliente/album', album.id]">
        <div class="album__cover">
          @if (album.coverUrl) {
            <img [src]="album.coverUrl" [alt]="album.title" loading="lazy" />
          }
        </div>
        <div class="album__meta">
          <h2>{{ album.title }}</h2>
          <span>{{ album.createdAt | date: 'dd/MM/yyyy' }}</span>
        </div>
      </a>
    } @empty {
      <p class="empty">Nenhum &aacute;lbum dispon&iacute;vel no momento.</p>
    }
  </div>
</section>
