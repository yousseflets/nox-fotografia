<section class="page">
  <header>
    <h1>Meus álbuns</h1>
    <p>Você vê apenas os ensaios associados à sua conta.</p>
  </header>

  <div class="grid">
    @for (album of albums$ | async; track album.id) {
      <a class="album panel" [routerLink]="['/cliente/album', album.id]">
        <div class="album__cover">
          @if (album.coverUrl) {
            <img [src]="album.coverUrl" [alt]="album.title" loading="lazy" />
          }
        </div>
        <div class="album__meta">
          <h2>{{ album.title }}</h2>
          <span>{{ album.createdAt | date: 'dd/MM/yyyy' }}</span>
        </div>
      </a>
    } @empty {
      <p class="empty panel">Nenhum álbum disponível no momento.</p>
    }
  </div>
</section>
